# ─────────────────────────────────────────────────────────────────────────────
# nginx/conf.d/proxy_params.conf  —  Shared upstream proxy settings
# Included by all location blocks that proxy to Gunicorn
# ─────────────────────────────────────────────────────────────────────────────

# Pass real client IP to the app
proxy_set_header  Host              $host;
proxy_set_header  X-Real-IP         $remote_addr;
proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header  X-Forwarded-Proto $scheme;

# WebSocket support (Dash uses long-polling / ws for callbacks)
proxy_http_version  1.1;
proxy_set_header    Upgrade    $http_upgrade;
proxy_set_header    Connection "upgrade";

# Timeouts — Dash callbacks can take a moment on first render
proxy_connect_timeout  10s;
proxy_send_timeout     60s;
proxy_read_timeout     60s;

# Buffer tweaks for Dash JSON payloads
proxy_buffering            on;
proxy_buffer_size          16k;
proxy_buffers              4 32k;
proxy_busy_buffers_size    64k;
