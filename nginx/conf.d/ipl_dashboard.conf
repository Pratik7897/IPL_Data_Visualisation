# ─────────────────────────────────────────────────────────────────────────────
# nginx/conf.d/ipl_dashboard.conf  —  Virtual host & SSL config
# Phase 3B — Nginx + SSL termination
#
# Two modes (controlled by env var NGINX_MODE):
#   http-only   → plain HTTP on port 80  (local dev / first boot)
#   ssl         → HTTPS on 443, HTTP redirects to HTTPS
#
# To switch modes, set NGINX_MODE=ssl in docker-compose and restart Nginx.
# ─────────────────────────────────────────────────────────────────────────────

# ── Security headers map ─────────────────────────────────────────────────────
map $sent_http_content_type $csp_header {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.plot.ly; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' data:; connect-src 'self'";
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTP server — serves directly on port 80
# When SSL is active this block redirects to HTTPS instead.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen       80;
    listen  [::]:80;
    server_name  _;                 # match any hostname (replace with your domain)

    # ── Let's Encrypt ACME challenge (needed for certbot) ────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ── Health check endpoint (bypasses rate limiting) ────────────────────────
    location = /health {
        access_log  off;
        return 200  "OK\n";
        add_header  Content-Type text/plain;
    }

    # ── Export endpoints (CSV / JSON / Markdown downloads) ───────────────────
    # Allow longer timeouts for large dataset streaming (up to 5 min)
    location /export/ {
        limit_req        zone=general burst=5 nodelay;
        proxy_pass       http://ipl_dashboard;
        include          /etc/nginx/conf.d/proxy_params.conf;
        proxy_read_timeout     300s;    # 5 min for big CSV exports
        proxy_send_timeout     300s;
        proxy_buffering        off;     # stream directly to client
        add_header X-Export-By "IPL-Sentiment-Dashboard";
    }

    # ── Redirect all other HTTP → HTTPS (uncomment when SSL cert is ready) ────
    # return 301 https://$host$request_uri;

    # ── Proxy to Dash (HTTP-only mode) ───────────────────────────────────────
    location / {
        limit_req        zone=general burst=40 nodelay;
        limit_conn       addr 30;

        proxy_pass       http://ipl_dashboard;
        include          /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Dash callback API — tighter rate limit ────────────────────────────────
    location /_dash-update-component {
        limit_req        zone=api burst=20 nodelay;
        proxy_pass       http://ipl_dashboard;
        include          /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Static assets — aggressive caching ───────────────────────────────────
    location ~* ^/_dash-component-suites/ {
        proxy_pass       http://ipl_dashboard;
        include          /etc/nginx/conf.d/proxy_params.conf;
        expires          7d;
        add_header       Cache-Control "public, immutable";
        access_log       off;
    }
}

