# ─────────────────────────────────────────────────────────────────────────────
# nginx/nginx.conf  —  Main Nginx configuration
# IPL Sentiment Dashboard — Phase 3B
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;            # one worker per CPU core

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;        # hide Nginx version

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml
        font/woff2;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    # General request limiting — 20 req/sec per IP
    limit_req_zone  $binary_remote_addr  zone=general:10m  rate=20r/s;
    # Dashboard API callbacks — 10 req/sec per IP
    limit_req_zone  $binary_remote_addr  zone=api:10m      rate=10r/s;

    # ── Connection limiting ──────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ── Real IP (when behind a cloud LB / CDN) ───────────────────────────────
    # Uncomment if you're behind Cloudflare or AWS ELB:
    # set_real_ip_from  0.0.0.0/0;
    # real_ip_header    X-Forwarded-For;

    # ── Upstream (Gunicorn / Dash) ───────────────────────────────────────────
    upstream ipl_dashboard {
        server dashboard:8050;
        keepalive 32;               # persistent connections to Gunicorn
    }

    # ── Include vhost configs ────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
